[package]
name = "apt-repository"
version = "0.1.0"
edition = "2021"
description = "Creating and parsing APT repositories"
license = "Apache-2.0"
repository = "https://github.com/janitor-team/janitor.git"
homepage = "https://github.com/janitor-team/janitor"
keywords = ["apt", "debian", "package", "repository"]
categories = ["development-tools"]

[lib]
name = "apt_repository"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
bzip2 = ">=0.4,<0.7"
sha2 = "0.10"
sha1 = "0.10"
md5 = ">=0.7,<0.9"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = ">=1.0,<3"
tokio = { version = "1.0", features = ["fs", "io-util"], optional = true }
async-trait = { version = "0.1", optional = true }
tempfile = { version = "3.8", optional = true }
debian-control = { version = "0.3.13", features = ["chrono"] }
deb822-fast = { version = "0.2.3" }
debversion = ">=0.4.7, <0.6"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.8"
async-trait = "0.1"

[features]
default = ["async"]
async = ["tokio", "async-trait", "tempfile"]
